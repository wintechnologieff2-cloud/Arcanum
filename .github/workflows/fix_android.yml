name: Fix Android Maps API Key

on:
  push:
    branches: [ flutterflow ]

jobs:
  fix-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: flutterflow

      - name: Check if API key already exists
        id: check
        run: |
          if grep -q "com.google.android.geo.API_KEY" android/app/src/main/AndroidManifest.xml; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Add Google Maps API Key
        if: steps.check.outputs.exists == 'false'
        run: |
          sed -i 's|</application>|    <meta-data android:name="com.google.android.geo.API_KEY" android:value="AIzaSyAd3lRtNdU8cAN5_4JCh6Uv4UdFMu5pGFM"/>\n</application>|' android/app/src/main/AndroidManifest.xml

      - name: Commit changes
        if: steps.check.outputs.exists == 'false'
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add android/app/src/main/AndroidManifest.xml
          git commit -m "Add Google Maps API Key [skip ci]" || echo "No changes"
          git push
